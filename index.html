<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mavis!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#fdf8f3;min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem}
.wrap{max-width:600px;width:100%}
.hero{text-align:center;margin-bottom:1.2rem}
.tag{display:inline-block;background:#1a1a1a;color:#f5c842;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:50px;margin-bottom:0.8rem}
h1{font-family:'Playfair Display',serif;font-size:2.6rem;color:#1a1a1a;line-height:1.1;margin-bottom:0.3rem}
h1 em{font-style:italic;color:#c9503a}
.date{font-size:12px;color:#999;letter-spacing:1px;text-transform:uppercase}
canvas{display:block;margin:0 auto;border-radius:20px;background:#fff9f5;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.blow-msg{text-align:center;font-size:14px;color:#c9503a;font-weight:500;min-height:22px;margin:0.6rem 0;font-family:'Playfair Display',serif;font-style:italic}
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:1rem}
.btn-blow{background:#1a1a1a;color:#fff;border:none;border-radius:50px;padding:10px 28px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .15s}
.btn-blow:hover{background:#c9503a}
.divider{display:flex;align-items:center;gap:12px;margin:1rem 0}
.divider-line{flex:1;height:1px;background:#e8e0d8}
.divider-text{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#bbb}
.form-box{background:#fff;border-radius:20px;padding:1.4rem;border:1px solid #f0e8e0;margin-bottom:1.2rem}
.lang-tabs{display:flex;gap:6px;margin-bottom:1rem}
.lang-tab{padding:5px 16px;border-radius:50px;border:1px solid #e8e0d8;font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;background:#fff;color:#888;transition:all .15s}
.lang-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.form-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:5px;display:block}
input,textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid #ede8e3;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:#fdf8f3;color:#1a1a1a;transition:border .15s;margin-bottom:10px}
input:focus,textarea:focus{border-color:#1a1a1a;background:#fff}
textarea{resize:none;height:72px}
.btn-submit{background:#c9503a;color:#fff;border:none;border-radius:50px;padding:11px 24px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;width:100%;letter-spacing:.3px;transition:all .15s}
.btn-submit:hover{background:#1a1a1a}
.form-msg{text-align:center;font-size:12px;min-height:18px;margin-top:6px}
.wishes-section{margin-top:0.5rem}
.wishes-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:#1a1a1a;margin-bottom:1rem}
.wish-card{position:relative;background:linear-gradient(135deg,#fffdf9 0%,#fff8f0 100%);border:1px solid #e8d5c0;border-radius:16px;padding:20px 20px 20px 28px;margin-bottom:12px;overflow:hidden}
.wish-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#c9503a,#f5c842)}
.wish-card::after{content:'"';position:absolute;right:14px;top:6px;font-family:'Playfair Display',serif;font-size:60px;color:#f5c842;opacity:0.25;line-height:1}
.wish-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:#1a1a1a;color:#f5c842;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Playfair Display',serif}
.wish-name{font-size:13px;font-weight:500;color:#1a1a1a}
.wish-time{font-size:10px;color:#bbb;letter-spacing:.3px}
.wish-msg{font-family:'Dancing Script',cursive;font-size:16px;color:#5a3a2a;line-height:1.6;padding-left:2px}
.empty{text-align:center;font-size:13px;color:#ccc;padding:1.5rem;font-style:italic}

/* POPUP */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
.popup-overlay.show{opacity:1;pointer-events:all}
.popup-box{background:#fff;border-radius:24px;padding:2.5rem 2rem;max-width:340px;width:90%;text-align:center;transform:scale(0.88);transition:transform .3s;position:relative;overflow:hidden}
.popup-overlay.show .popup-box{transform:scale(1)}
.popup-box::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#c9503a,#f5c842,#c9503a)}
.popup-candle{font-size:2.5rem;margin-bottom:0.8rem}
.popup-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:#1a1a1a;margin-bottom:0.5rem}
.popup-title em{color:#c9503a;font-style:italic}
.popup-msg{font-size:13px;color:#888;line-height:1.6;margin-bottom:1.5rem}
.popup-sub{font-family:'Dancing Script',cursive;font-size:15px;color:#c9503a;margin-bottom:1.5rem}
.popup-btn{background:#1a1a1a;color:#fff;border:none;border-radius:50px;padding:10px 28px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.popup-btn:hover{background:#c9503a}
.popup-confetti{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="tag">May 31 · Birthday</div>
    <h1>Happy Birthday,<br><em>Mavis!</em></h1>
    <p class="date">생일 축하해요, Mavis!</p>
  </div>

  <canvas id="c" width="560" height="340"></canvas>
  <div class="blow-msg" id="blowMsg"></div>
  <div class="controls">
    <button class="btn-blow" id="blowBtn">Blow the candles!</button>
  </div>

  <div class="divider"><div class="divider-line"></div><div class="divider-text">Light a candle</div><div class="divider-line"></div></div>

  <div class="form-box">
    <div class="lang-tabs">
      <button class="lang-tab active" onclick="setLang('en',this)">English</button>
      <button class="lang-tab" onclick="setLang('kr',this)">한국어</button>
    </div>
    <label class="form-label" id="lbl-name">Your name</label>
    <input id="nameInput" placeholder="Enter your name..." maxlength="12"/>
    <label class="form-label" id="lbl-msg">Birthday wish</label>
    <textarea id="msgInput" placeholder="Write your wish for Mavis..."></textarea>
    <div class="form-msg" id="formMsg"></div>
    <button class="btn-submit" onclick="addWish()" id="submitBtn">Light a candle & send wish</button>
  </div>

  <div class="wishes-section">
    <div class="wishes-title">Wishes for Mavis</div>
    <div id="wishesList"><div class="empty">Be the first to light a candle...</div></div>
  </div>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <canvas class="popup-confetti" id="popupCanvas"></canvas>
    <div class="popup-candle">🕯️</div>
    <div class="popup-title" id="popup-title">Thank you,<br><em id="popup-name"></em>!</div>
    <div class="popup-sub" id="popup-sub">Your candle is lit for Mavis</div>
    <div class="popup-msg" id="popup-msg">Your wish has been delivered.<br>Mavis is so lucky to have you!</div>
    <button class="popup-btn" id="popup-close" onclick="closePopup()">Close</button>
  </div>
</div>

<script>
const SUPA_URL='https://ltssetphixssyuydrqln.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0c3NldHBoaXhzc3l1eWRycWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDc3NjEsImV4cCI6MjA5NTYyMzc2MX0.mqveDi6ZP7Rx-m3VrtUdbxa9WWAOC_JUYTHVfT58alU';

const LANGS={
  en:{
    name:'Your name',msg:'Birthday wish',
    ph_name:'Enter your name...',ph_msg:'Write your wish for Mavis...',
    submit:'Light a candle & send wish',
    empty:'Be the first to light a candle...',
    popup_title:'Thank you,',
    popup_sub:'Your candle is lit for Mavis ✨',
    popup_msg:"Your wish has been delivered.\nMavis is so lucky to have you!",
    popup_close:'Close'
  },
  kr:{
    name:'이름',msg:'생일 축하 메시지',
    ph_name:'이름을 입력하세요...',ph_msg:'Mavis에게 축하 메시지를 남겨주세요...',
    submit:'초 켜기 & 메시지 보내기',
    empty:'첫 번째로 초를 켜보세요...',
    popup_title:'감사해요,',
    popup_sub:'Mavis를 위한 초가 켜졌어요 ✨',
    popup_msg:"당신의 소원이 전달되었어요.\nMavis는 당신이 있어 정말 행복해요!",
    popup_close:'닫기'
  }
};
let currentLang='en';
let senderName='';

function setLang(lang,el){
  currentLang=lang;
  document.querySelectorAll('.lang-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const L=LANGS[lang];
  document.getElementById('lbl-name').textContent=L.name;
  document.getElementById('lbl-msg').textContent=L.msg;
  document.getElementById('nameInput').placeholder=L.ph_name;
  document.getElementById('msgInput').placeholder=L.ph_msg;
  document.getElementById('submitBtn').textContent=L.submit;
}

function showPopup(name){
  const L=LANGS[currentLang];
  document.getElementById('popup-title').innerHTML=`${L.popup_title}<br><em>${name}</em>!`;
  document.getElementById('popup-sub').textContent=L.popup_sub;
  document.getElementById('popup-msg').innerHTML=L.popup_msg.replace('\n','<br>');
  document.getElementById('popup-close').textContent=L.popup_close;
  document.getElementById('popup').classList.add('show');
  startPopupConfetti();
}

function closePopup(){
  document.getElementById('popup').classList.remove('show');
  stopPopupConfetti();
}

// popup confetti
let popupConfetti=[];
let popupAnimId=null;
const pc=document.getElementById('popupCanvas');
const pctx=pc.getContext('2d');

function resizePopupCanvas(){
  pc.width=pc.offsetWidth;
  pc.height=pc.offsetHeight;
}

function startPopupConfetti(){
  resizePopupCanvas();
  popupConfetti=[];
  const cols=['#c9503a','#f5c842','#1a1a1a','#4a9aba','#8b5cf6','#059669','#ec4899'];
  for(let i=0;i<60;i++){
    popupConfetti.push({
      x:Math.random()*pc.width,y:-10-Math.random()*40,
      vx:(Math.random()-0.5)*3,vy:Math.random()*2+1,
      r:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.15,
      s:4+Math.random()*7,
      color:cols[Math.floor(Math.random()*cols.length)],
      life:1,circle:Math.random()>.5
    });
  }
  function loop(){
    pctx.clearRect(0,0,pc.width,pc.height);
    popupConfetti=popupConfetti.filter(p=>p.y<pc.height+20);
    popupConfetti.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      pctx.save();pctx.translate(p.x,p.y);pctx.rotate(p.r);
      pctx.fillStyle=p.color;pctx.globalAlpha=0.85;
      if(p.circle){pctx.beginPath();pctx.arc(0,0,p.s/2,0,Math.PI*2);pctx.fill();}
      else{pctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.4);}
      pctx.restore();
    });
    if(popupConfetti.length>0) popupAnimId=requestAnimationFrame(loop);
    else pctx.clearRect(0,0,pc.width,pc.height);
  }
  if(popupAnimId) cancelAnimationFrame(popupAnimId);
  loop();
}

function stopPopupConfetti(){
  if(popupAnimId) cancelAnimationFrame(popupAnimId);
  pctx.clearRect(0,0,pc.width,pc.height);
}

// cake canvas
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let candles=[];
let blown=false;
let confetti=[];

function drawCake(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff9f5';
  ctx.beginPath();ctx.roundRect(0,0,W,H,20);ctx.fill();
  ctx.beginPath();ctx.ellipse(W/2,H-18,200,16,0,0,Math.PI*2);ctx.fillStyle='#e8ddd5';ctx.fill();
  let g=ctx.createLinearGradient(40,220,40,H-20);g.addColorStop(0,'#e8c9a0');g.addColorStop(1,'#c9a070');
  ctx.beginPath();ctx.roundRect(40,230,480,80,14);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#fff8f0';
  for(let i=0;i<10;i++){ctx.beginPath();ctx.ellipse(68+i*44,232,16,10,0,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#c9503a';
  for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(75+i*50,260,4,0,Math.PI*2);ctx.fill();}
  let g2=ctx.createLinearGradient(70,155,70,232);g2.addColorStop(0,'#f0c8a8');g2.addColorStop(1,'#d4a878');
  ctx.beginPath();ctx.roundRect(70,170,420,64,12);ctx.fillStyle=g2;ctx.fill();
  ctx.fillStyle='#fff8f0';
  for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(95+i*56,172,14,9,0,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#1a1a1a';
  for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(110+i*72,200,3.5,0,Math.PI*2);ctx.fill();}
  let g3=ctx.createLinearGradient(110,95,110,172);g3.addColorStop(0,'#f8e8d0');g3.addColorStop(1,'#e8c8a0');
  ctx.beginPath();ctx.roundRect(110,115,340,60,12);ctx.fillStyle=g3;ctx.fill();
  ctx.fillStyle='#fff8f0';
  for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(130+i*64,117,12,8,0,0,Math.PI*2);ctx.fill();}
  ctx.save();
  ctx.font='italic bold 18px "Playfair Display",serif';
  ctx.fillStyle='#c9503a';ctx.textAlign='center';
  ctx.fillText('Mavis ♥',W/2,152);
  ctx.restore();

  const cols=['#c9503a','#1a1a1a','#f5c842','#4a9aba','#8b5cf6','#059669','#dc2626','#d97706','#ec4899','#0891b2'];
  candles.forEach((c,i)=>{
    const x=c.x;
    ctx.beginPath();ctx.roundRect(x-7,65,14,52,4);ctx.fillStyle=cols[i%cols.length];ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.beginPath();ctx.roundRect(x-2,69,3,44,2);ctx.fill();
    ctx.beginPath();ctx.moveTo(x,65);ctx.lineTo(x,56);ctx.strokeStyle='#555';ctx.lineWidth=1.5;ctx.stroke();
    if(c.lit)drawFlame(x,56,Date.now());
    const label=c.name.length>7?c.name.slice(0,6)+'..':c.name;
    ctx.save();
    ctx.font='bold 9px "DM Sans",sans-serif';
    const tw=ctx.measureText(label).width;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.roundRect(x-tw/2-4,78,tw+8,13,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,x,85);
    ctx.restore();
  });

  confetti.forEach(p=>{
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
    if(p.circle){ctx.beginPath();ctx.arc(0,0,p.s/2,0,Math.PI*2);ctx.fill();}
    else{ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.4);}
    ctx.restore();
  });
  ctx.globalAlpha=1;
}

function drawFlame(x,y,t){
  const f=Math.sin(t/90+x)*2;
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-6+f,-8,-8+f,-18,0,-24);ctx.bezierCurveTo(8-f,-18,6-f,-8,0,0);ctx.fillStyle='#f59e0b';ctx.fill();
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-3+f,-5,-4,-12,0,-17);ctx.bezierCurveTo(4,-12,3-f,-5,0,0);ctx.fillStyle='#fef3c7';ctx.fill();
  ctx.beginPath();ctx.arc(0,-17,2.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}

function spawnConfetti(){
  const cols=['#c9503a','#f5c842','#1a1a1a','#4a9aba','#8b5cf6','#059669','#ec4899'];
  for(let i=0;i<120;i++){
    confetti.push({x:80+Math.random()*400,y:30+Math.random()*80,vx:(Math.random()-0.5)*6,vy:-Math.random()*7-2,r:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.25,s:4+Math.random()*9,color:cols[Math.floor(Math.random()*cols.length)],life:1,circle:Math.random()>.5});
  }
}

function updateConfetti(){
  confetti=confetti.filter(p=>p.life>0);
  confetti.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.r+=p.vr;p.life-=0.007;});
}

function placeCandlesFromWishes(wishes){
  candles=[];
  const maxC=Math.min(wishes.length,10);
  if(!maxC)return;
  const spacing=Math.min(52,400/maxC);
  const startX=W/2-(spacing*(maxC-1))/2;
  for(let i=0;i<maxC;i++) candles.push({x:startX+i*spacing,name:wishes[i].name,lit:!blown});
}

document.getElementById('blowBtn').onclick=()=>{
  if(blown){
    blown=false;confetti=[];
    candles.forEach(c=>c.lit=true);
    document.getElementById('blowMsg').textContent='';
    document.getElementById('blowBtn').textContent='Blow the candles!';
    return;
  }
  if(!candles.length){document.getElementById('blowMsg').textContent='No candles yet!';return;}
  let i=0;
  const iv=setInterval(()=>{
    if(i<candles.length){candles[i].lit=false;i++;}
    else{
      clearInterval(iv);blown=true;spawnConfetti();
      document.getElementById('blowMsg').textContent='Happy Birthday, Mavis! 생일 축하해요! 🎉';
      document.getElementById('blowBtn').textContent='Relight candles!';
    }
  },120);
};

async function addWish(){
  const name=document.getElementById('nameInput').value.trim();
  const message=document.getElementById('msgInput').value.trim();
  const fMsg=document.getElementById('formMsg');
  if(!name||!message){
    fMsg.style.color='#c9503a';
    fMsg.textContent=currentLang==='kr'?'이름과 메시지를 입력해주세요!':'Please enter your name and wish!';
    return;
  }
  fMsg.style.color='#999';
  fMsg.textContent=currentLang==='kr'?'전송 중...':'Sending...';
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/birthday_wishes`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal'},
      body:JSON.stringify({name,message})
    });
    if(!res.ok)throw new Error();
    const sentName=name;
    document.getElementById('nameInput').value='';
    document.getElementById('msgInput').value='';
    fMsg.textContent='';
    loadWishes();
    showPopup(sentName);
  }catch(e){
    fMsg.style.color='#c9503a';
    fMsg.textContent='Something went wrong. Try again!';
  }
}

async function loadWishes(){
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/birthday_wishes?select=*&order=created_at.asc`,{
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`}
    });
    const data=await res.json();
    placeCandlesFromWishes(data);
    const list=document.getElementById('wishesList');
    if(!data.length){list.innerHTML=`<div class="empty">${LANGS[currentLang].empty}</div>`;return;}
    list.innerHTML=[...data].reverse().map(w=>`
      <div class="wish-card">
        <div class="wish-header">
          <div class="avatar">${w.name.slice(0,2).toUpperCase()}</div>
          <div>
            <div class="wish-name">${w.name}</div>
            <div class="wish-time">${new Date(w.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>
        <div class="wish-msg">${w.message}</div>
      </div>`).join('');
  }catch(e){}
}

// close popup when clicking overlay
document.getElementById('popup').addEventListener('click',function(e){
  if(e.target===this) closePopup();
});

function loop(){updateConfetti();drawCake();requestAnimationFrame(loop);}
loop();
loadWishes();
setInterval(loadWishes,8000);
</script>
</body>
</html>
